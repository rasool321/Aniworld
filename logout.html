<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniWorld</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome -->
  <style>
    /* General body and layout */
body {
  background-color: #121212;
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
}

/* Navbar */
.navbar {
  background-color: #1a1a1a;
  padding: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  width: 100%;
}

.navbar .logo {
  font-size: 2rem;
  color: #00ffee;
  font-weight: bold;
  margin-left: 20px;
}

.navbar .nav-links {
  list-style: none;
  display: flex;
  margin-right: 20px;
}

.navbar .nav-links li {
  margin: 0 15px;
}

.navbar .nav-links a {
  color: white;
  text-decoration: none;
  font-size: 1rem;
}

.navbar .nav-links a:hover {
  color: #00ffee;
}

/* Sidebar */
.sidebar {
  background-color: #1c1f2a;
  position: fixed;
  top: 70px;
  left: 0;
  width: 200px;
  height: calc(100vh - 70px);
  padding: 20px;
  color: white;
}

.sidebar h3 {
  font-size: 1.5rem;
  margin-bottom: 20px;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar ul li {
  margin: 10px 0;
}

.sidebar ul li a {
  color: #00ffee;
  text-decoration: none;
}

.sidebar ul li a:hover {
  text-decoration: underline;
}

/* Main content area */
.about-container {
  margin-left: 220px;
  padding: 20px;
}

/* Footer */
footer {
  background-color: #1a1a1a;
  color: white;
  text-align: center;
  padding: 20px 0;
  position: relative;
  bottom: 0;
  width: 100%;
}

footer p {
  font-size: 1rem;
}

.social-icons {
  margin-top: 10px;
}

.social-icon {
  color: white;
  font-size: 2rem;
  margin: 0 15px;
  transition: 0.3s;
}

.social-icon:hover {
  color: #00ffee;
}

/* Add a logout button style (for the sidebar) */
#logout-link {
  color: #ff4d4d;
  font-size: 1.2rem;
  cursor: pointer;
}

#logout-link:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>
  <!-- Navigation bar -->
  <header>
    <div class="navbar">
      <h1 class="logo">AniWorld</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="anime.html">Anime List</a></li>
          <li><a href="about.html" class="active">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Menu</h3>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
      <li><a href="popular.html">Popular</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="#" id="logout-link">Logout</a></li> <!-- Logout link -->
    </ul>
  </div>

  <!-- Main content area -->
  <main class="about-container">
    <section class="about-section">
      <h2>Welcome to AniWorld 🌸</h2>
      <p>AniWorld is a place where anime lovers gather! We aim to create a beautiful, interactive, and exciting platform for fans to explore, discuss, and celebrate anime.</p>
    </section>
  </main>

</body>
</html>
